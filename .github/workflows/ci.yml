name: CI

# libipt owns the IPT inference core and exposes a stable C ABI (include/ipt.h);
# consumers (e.g. ipt_tilde) build against that header + libipt.dylib. Two checks:
#
#   * The public header stays clean as both C and C++.
#   * The library builds, links, and actually loads at runtime on Apple Silicon
#     (CMake fetches libtorch; the inference core and r8brain live in this tree).

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The public header must stay clean as both C and C++. Fast, needs nothing.
  # ---------------------------------------------------------------------------
  header:
    name: public header is clean (C / C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax-check include/ipt.h
        run: |
          set -euxo pipefail
          gcc -std=c11   -x c   -fsyntax-only -Wall -Wextra -Werror include/ipt.h
          g++ -std=c++17 -x c++ -fsyntax-only -Wall -Wextra -Werror include/ipt.h

  # ---------------------------------------------------------------------------
  # Build the self-contained library from scratch and confirm it loads. Runs on
  # pushes and pull requests. Must pass.
  # ---------------------------------------------------------------------------
  build:
    name: build & link
    runs-on: macos-14            # Apple Silicon — the only supported target
    steps:
      - uses: actions/checkout@v4
      - name: build from scratch (CMake fetches libtorch)
        run: |
          set -eux
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 8
      - name: check the library and demo were produced
        run: |
          set -eux
          test -f build/libipt.dylib
          test -x build/example
      - name: runtime check — the library actually loads
        run: bash .github/scripts/smoke.sh
